# PaddleOCR-VL-1.6 官方百度两容器部署
# 参考: https://github.com/PaddlePaddle/PaddleOCR/blob/main/deploy/paddleocr_vl_docker/accelerators/nvidia-gpu/compose.yaml
#
# 启动:
#   docker compose -f docker-compose-baidu.yml pull
#   docker compose -f docker-compose-baidu.yml up -d
# 停止:
#   docker compose -f docker-compose-baidu.yml down
#
# 宿主机目录说明（首次启动时自动下载，后续复用）：
#   /media/llm/paddleocr/official_models/
#     ├── PaddleOCR-VL-1.6/          VLM 推理模型（paddle 静态图格式，API 容器用）
#     ├── PP-DocLayoutV3/             版面分析模型
#     ├── PP-LCNet_x1_0_doc_ori/     文档方向分类模型
#     └── UVDoc/                      文档矫正模型
#   /media/llm/paddleocr/fonts/       渲染字体（PingFang 等）
#   /media/llm/paddleocr/vlm_models/  VLM 推理模型（HuggingFace 格式，VLM server 用）

services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:latest-nvidia-gpu-offline
    container_name: paddleocr-vl-1.6-api
    ports:
      - "30008:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    restart: unless-stopped
    environment:
      - VLM_BACKEND=vllm
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    volumes:
      # paddle 静态图模型缓存（API 容器所需的版面/OCR 模型均在此，未命中时自动下载到此目录）
      - ./official_models:/home/paddleocr/.paddlex/official_models
      # 已有本地模型直接挂载到对应子目录，优先级高于父目录挂载，避免重复下载 
      # modelscope download --model PaddlePaddle/PP-DocLayoutV3 --local_dir PaddlePaddle/PP-DocLayoutV3
      - /media/llm/PaddlePaddle/PP-DocLayoutV3:/home/paddleocr/.paddlex/official_models/PP-DocLayoutV3
      # 渲染字体
      - ./fonts:/home/paddleocr/.paddlex/fonts
      # 产线配置（use_doc_preprocessor: True，扫描件启用方向矫正+畸变矫正）
      - ./pipeline_config_vllm.yaml:/home/paddleocr/pipeline_config_vllm.yaml:ro
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_vllm.yaml"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:latest-nvidia-gpu-offline
    container_name: paddleocr-vl-1.6-vlm-server
    # 暴露 vLLM OpenAI 兼容接口（/v1/chat/completions 等）供外部直连
    # 与方案二 docker-compose.yml 底层完全相同：vllm.entrypoints.openai.api_server
    ports:
      - "30009:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    restart: unless-stopped
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    volumes:
      # VLM 推理模型（HuggingFace 格式，vLLM 使用）
      # 本地路径：/media/llm/PaddlePaddle/PaddleOCR-VL-1.6
      # modelscope download --model PaddlePaddle/PaddleOCR-VL-1.6 --local_dir PaddlePaddle/PaddleOCR-VL-1.6
      - /media/llm/PaddlePaddle/PaddleOCR-VL-1.6:/home/paddleocr/vlm_model
    # 通过 --model_dir 指定本地模型路径，跳过下载
    command: >
      paddleocr genai_server
        --model_name PaddleOCR-VL-1.6-0.9B
        --model_dir /home/paddleocr/vlm_model
        --host 0.0.0.0
        --port 8080
        --backend vllm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
