# Qwen3-Omni-30B-A3B 2×A800-80G 高吞吐 + 稳定生产
# 基于镜像内置 qwen3_omni_moe.yaml 调优；devices 为容器内编号（物理卡 2、3 → cuda:0、1）
# OOM 时依次降：各 stage max_num_seqs → gpu_memory_utilization

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 20
    gpu_memory_utilization: 0.88
    trust_remote_code: true
    enable_prefix_caching: true
    enable_chunked_prefill: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 10
    gpu_memory_utilization: 0.55
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    # 必须 >= max_model_len(65536)，与镜像内置 qwen3_omni_moe.yaml 一致
    max_num_batched_tokens: 65536
    max_num_seqs: 10
    gpu_memory_utilization: 0.12
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
