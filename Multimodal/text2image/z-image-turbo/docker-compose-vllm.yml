version: "3.9"

services:
  vllm_z_image_turbo:
    image: model.vnet.com/sjhl/vllm-omni:v0.22.0
    runtime: nvidia
    container_name: vllm-z-image-turbo
    environment:
      - NVIDIA_VISIBLE_DEVICES=6,7
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_DISABLE_REQUIRE=1   # 宿主机驱动超出镜像白名单时跳过约束检查
      # 修复宿主机驱动与容器 compat libcuda 版本不匹配（Error 803）
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    volumes:
      - /media/llm:/media/llm
      - ./cache:/root/.cache/huggingface  # 缓存 tokenizer 等，加速冷启动
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "9111:8000"
    # 显式 argv 启动，避免 "vllm serve" 被误解析为单个可执行文件名
    command:
      - vllm
      - serve
      - --model
      - /media/llm/Tongyi-MAI/Z-Image-Turbo
      - --omni
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --served-model-name
      - qwen-image
      - --gpu-memory-utilization
      - "0.9"
      # 并发/调度（压测时优先调这两个）
      # - 吞吐优先：max-num-seqs 调大（如 4/6），同时观察显存与排队延迟
      # - 延迟优先：max-num-seqs 调小（如 1/2），避免尾延迟暴涨
      - --max-num-seqs
      - "4"
      # Z-Image-Turbo 1024x1024 峰值显存约 25GB，批处理预算可适当放宽
      - --max-num-batched-tokens
      - "4096"
      - --trust-remote-code
      # torch.compile + CUDAGraph，提升稳态推理吞吐（与 max-num-seqs 对齐）
      - --compilation-config
      - '{"mode": 3, "cudagraph_capture_sizes": [1, 2, 4]}'
      # - --enforce-eager  # 开启会禁用/削弱编译与图捕获，排障时再打开
      - --enable-request-id-headers
      - --enable-cache-dit-summary  # Cache-DiT 优化，提升推理速度
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["6","7"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
