# Qwen3-TTS deploy：单卡 2 并发（基于 v0.22.0 镜像 deploy/qwen3_tts.yaml）
# 仅将 stage0/stage1 的 max_num_seqs 从 10 调整为 2，其余保留镜像默认优化项。
#
# 启动：--deploy-config /stage_configs/qwen3_tts_2seq.yaml
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # Must match the decoder sliding attention window.
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      # Emit only the first audio chunk early, then return to codec_chunk_frames.
      initial_codec_chunk_frames: 1
      # Common Stage1 decode buckets:
      #   no-ref first/steady chunks: 25 / 97 frames
      #   Base ref-context first/steady chunks: 73 / 169 frames
      #   decoder internal non-streaming chunks: 325 frames
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]
      # 2 并发：code-predictor prefix CUDA graphs 对齐 seq bucket
      code_predictor_prefix_graphs: true
      code_predictor_prefix_graph_buckets: [2]
      code_predictor_prefix_graph_seq_lens: [2, 3, 4, 5, 6, 7, 8]

stages:
  - stage_id: 0
    max_num_seqs: 2
    gpu_memory_utilization: 0.3
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 2
    gpu_memory_utilization: 0.3
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0

platforms:
  npu:
    stages:
      - stage_id: 0
        enforce_eager: true
