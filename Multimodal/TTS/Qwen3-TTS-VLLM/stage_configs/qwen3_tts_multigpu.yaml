# 基于镜像内 qwen3_tts.yaml；双卡时 stage0(talker)→cuda:0、stage1(code2wav)→cuda:1（容器内编号，对应宿主机由 NVIDIA_VISIBLE_DEVICES 映射）
#
# 吞吐 / nvidia-smi 利用率说明：
# - 两 stage 串行流水：单请求下常是一张卡忙、另一张等数据，两卡同时 100% 不现实。
# - 提高并发（客户端多请求 + max_inflight + max_num_seqs）与每 stage 显存占比，更容易把 SM 打满。
# - code2wav 若提高 max_num_seqs 后出现杂音/OOM，请改回 1。
async_chunk: true
stage_args:
  - stage_id: 0
    stage_type: llm
    is_comprehension: true
    runtime:
      devices: "0"
    engine_args:
      model_stage: qwen3_tts
      max_num_seqs: 16
      model_arch: Qwen3TTSTalkerForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      enforce_eager: false
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: latent
      # 0.3 会严重限制 KV/批大小，GPU 易吃不饱；按单卡独占可适当调高（OOM 再降到 0.6~0.7）
      gpu_memory_utilization: 0.85
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 1536
      max_model_len: 4096
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.qwen3_tts.talker2code2wav_async_chunk
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      detokenize: false
      repetition_penalty: 1.05
      stop_token_ids: [2150]

  - stage_id: 1
    stage_type: llm
    runtime:
      devices: "1"
    engine_args:
      model_stage: code2wav
      # 仅 1 时第二块 GPU 往往长期偏闲；可试 2~4，异常则退回 1
      max_num_seqs: 2
      model_arch: Qwen3TTSCode2Wav
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.85
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 8192
      max_model_len: 32768
    engine_input_source: [0]
    final_output: true
    final_output_type: audio
    input_connectors:
      from_stage_0: connector_of_shared_memory
    tts_args:
      max_instructions_length: 500
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

runtime:
  enabled: true
  defaults:
    window_size: -1
    # 流水线在途批次数，略大于 1 有利于两卡重叠（过大可能增延迟 / 显存峰值）
    max_inflight: 4

  connectors:
    connector_of_shared_memory:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536
        codec_streaming: true
        connector_get_sleep_s: 0.005
        connector_get_max_wait_first_chunk: 3000
        connector_get_max_wait: 300
        codec_chunk_frames: 25
        codec_left_context_frames: 25

  edges:
    - from: 0
      to: 1
      window_size: -1
