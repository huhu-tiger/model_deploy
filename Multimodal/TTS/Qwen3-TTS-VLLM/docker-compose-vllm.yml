
services:
  vllm_qwen3_tts:
    image: model.vnet.com/sjhl/vllm-omni:v0.22.0
    container_name: vllm-qwen3-tts
    runtime: nvidia
    # 部分 docker-compose 校验器不接受顶层 gpus 字段；GPU 通过 nvidia runtime + NVIDIA_VISIBLE_DEVICES + deploy.device_ids 指定
    environment:
        - NVIDIA_VISIBLE_DEVICES=4
        - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        # 宿主机驱动高于镜像白名单时报错时可取消注释
        # - NVIDIA_DISABLE_REQUIRE=1
        - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    volumes:
      - /media/llm:/media/llm
      - ./cache:/root/.cache/huggingface
      - ./stage_configs/qwen3_tts_2seq.yaml:/stage_configs/qwen3_tts_2seq.yaml:ro
    ipc: host
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "9131:8091"
    # 以显式 argv 方式启动，避免把 "vllm serve" 误当成单个可执行文件名
    command:
      - vllm
      - serve
      - --model
      - /media/llm/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --omni
      - --deploy-config
      - /stage_configs/qwen3_tts_2seq.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "8091"
      - --served-model-name
      - Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --tensor-parallel-size
      - "1"
      # 双 stage 同卡：勿设顶层 gpu-memory-utilization，由 deploy 配置各 stage 的 0.3 分账
      - --trust-remote-code
      # 多用户 2 并发：与 stage 配置及 cudagraph_capture_sizes 对齐
      - --max-num-seqs
      - "2"
      - --compilation-config
      - '{"mode": 3, "cudagraph_capture_sizes": [1, 2]}'
      - --enable-request-id-headers
      - --cache-backend
      - cache_dit
      - --enable-cache-dit-summary
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
