version: "3.9"

services:
  vllm_qwen3_tts:
    image: model.vnet.com/sjhl/vllm-omni:v0.18.0
    container_name: vllm-qwen3-tts
    runtime: nvidia
    # 部分 docker-compose 校验器不接受顶层 gpus 字段；GPU 通过 nvidia runtime + NVIDIA_VISIBLE_DEVICES + deploy.device_ids 指定
    environment:
    #   - HF_HOME=/root/.cache/huggingface
        - NVIDIA_VISIBLE_DEVICES=4
        - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        # 宿主机驱动高于镜像白名单时报错时可取消注释
        # - NVIDIA_DISABLE_REQUIRE=1
        - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    volumes:
      - /media/llm:/media/llm
      - ./stage_configs/qwen3_tts_no_async_chunk.yaml:/stage_configs/qwen3_tts_no_async_chunk.yaml:ro
    ipc: host
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "9131:8091"
    # 以显式 argv 方式启动，避免把 "vllm serve" 误当成单个可执行文件名
    command:
      - vllm
      - serve
      - --model
      - /media/llm/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --omni
      - --stage-configs-path
      - /stage_configs/qwen3_tts_no_async_chunk.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "8091"
      - --served-model-name
      - Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.9"
      - --trust-remote-code
      - --max-num-seqs
      - "2"
      - --enable-cache-dit-summary
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
