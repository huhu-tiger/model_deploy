version: "3.9"

services:
  vllm_qwen3_tts:
    image: model.vnet.com/sjhl/vllm-omni:v0.16.0
    container_name: vllm-qwen3-tts
    runtime: nvidia
    # 部分 docker-compose 校验器不接受顶层 gpus 字段；GPU 通过 nvidia runtime + NVIDIA_VISIBLE_DEVICES + deploy.device_ids 指定
    environment:
    #   - HF_HOME=/root/.cache/huggingface
        - NVIDIA_VISIBLE_DEVICES=4
        - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        # 宿主机驱动高于镜像白名单时报错时可取消注释
        # - NVIDIA_DISABLE_REQUIRE=1
        - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    volumes:
      - /media/llm:/media/llm
    ipc: host
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "9131:8091"
    # 与 v0.16 镜像 ENTRYPOINT（vllm serve）对齐：仅传子命令参数，勿再写 vllm serve
    command:
      - --model
      - /media/llm/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --omni
      - --host
      - "0.0.0.0"
      - --port
      - "8091"
      - --served-model-name
      - Qwen3-TTS-12Hz-1.7B-CustomVoice
      # 双卡走 Omni 多 stage 各自 runtime.devices，非单模型张量并行；与分卡配置一致用 1
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.9"
      - --trust-remote-code
      # 与服务端并发相关；单请求场景 GPU 仍可能不满，压测时可调到 8~16（OOM 或尾延迟升高则回调）
      - --max-num-seqs
      - "8"
      - --enable-cache-dit-summary
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
