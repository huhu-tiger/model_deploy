version: "3.9"

# 2×A800-80G 高吞吐量化档 | AWQ-8bit
# AWQ 量化显存占用约为原始的 50%，可大幅提升并发与上下文长度
# OOM 时依次降：max-num-seqs → gpu-memory-utilization → max-model-len

services:
  vllm-qwen3-vl-32B:
    image: model.vnet.com/sjhl/vllm-openai:v0.22.1
    container_name: vllm-qwen3-vl-32B
    runtime: nvidia
    shm_size: "16gb"
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_DISABLE_REQUIRE=1   # 宿主机驱动 590.44 超出镜像声明的兼容白名单(<=570)，跳过约束检查
      # 宿主机驱动 590.44，但容器 compat 层为 575.57，ldconfig 优先加载了 compat/libcuda.so.575
      # 导致内核驱动(590) 与用户态库(575) 版本不匹配 → Error 803
      # 修复：将真实宿主机驱动路径置于 LD_LIBRARY_PATH 最前，覆盖 compat 层
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
      - VLLM_IMAGE_FETCH_TIMEOUT=60
      - VLLM_VIDEO_FETCH_TIMEOUT=120
      - OMP_NUM_THREADS=1
    volumes:
      - /media/llm:/media/llm
    ipc: host
    ports:
      - "9116:9116"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - --served-model-name
      - "Qwen3-VL-32B-Instruct"
      - --model
      - "/media/llm/cyankiwi/Qwen3-VL-30B-A3B-Instruct-AWQ-8bit"
      - --port
      - "9116"
      - --trust-remote-code
      - --tensor-parallel-size
      - "2"
      # - --enable-auto-tool-choice
      # - --tool-call-parser
      # - hermes
      - --dtype
      - auto                        # AWQ 模型推荐 auto，由量化层自动选择精度
      - --gpu-memory-utilization
      - "0.92"                      # 量化后显存余量充足，从 0.90 上调
      - --max-model-len
      - "32768"                     # 量化节省的显存用于扩大上下文窗口
      - --max-num-seqs
      - "48"                        # 并发请求数从 24 提升至 48
      - --max-num-batched-tokens
      - "32768"                     # 批处理 token 数对齐最大上下文
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --kv-cache-dtype
      - fp8                         # KV Cache fp8 进一步降低显存占用
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "4"                         # 缓存视觉编码器输出，减少重复编码，提升图像吞吐
      - --limit-mm-per-prompt.video
      - "0"
      - --limit-mm-per-prompt.image
      - "2"
    restart: always
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                capabilities: [gpu]
                device_ids: [ "0","1" ]
