version: '3.9'

# Qwen3-VL-Embedding-2B — 多模态 Embedding（vLLM pooling）
# 官方示例: vllm serve ... --runner pooling --max-model-len 8192
# OOM 时依次降: max-num-seqs → max-model-len → gpu-memory-utilization
# 启动: docker compose up -d

services:
  qwen3-vl-embedding-2b:
    image: model.vnet.com/sjhl/vllm-openai:v0.24.0
    container_name: qwen3-vl-embedding-2b
    runtime: nvidia
    shm_size: "8gb"
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_IMAGE_FETCH_TIMEOUT: "60"
      VLLM_VIDEO_FETCH_TIMEOUT: "120"
      OMP_NUM_THREADS: "1"
    volumes:
      - /media/llm:/media/llm
      - /etc/localtime:/etc/localtime
    ports:
      - "8018:8018"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8018/health"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 300s
    command: >
      --served-model-name "Qwen3-VL-Embedding-2B"
      --model "/media/llm/Qwen/Qwen3-VL-Embedding-2B"
      --port 8018
      --runner pooling
      --trust-remote-code
      --dtype bfloat16
      --max-model-len 8192
      --gpu-memory-utilization 0.90
      --max-num-seqs 64
      --max-num-batched-tokens 8192
      --enable-chunked-prefill
      --enable-prefix-caching
      --mm-processor-cache-gb 0
      --limit-mm-per-prompt.image 2
      --limit-mm-per-prompt.video 1
      --hf_overrides '{"matryoshka_dimensions":[2048]}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

networks:
  default:
    driver: bridge
