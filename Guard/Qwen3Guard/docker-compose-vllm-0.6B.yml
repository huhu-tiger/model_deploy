version: "3.9"

services:
  qwen3guard-gen-0.6b:
    image: model.vnet.com/sjhl/vllm-openai:v0.15.0-cu130
    container_name: qwen3guard-gen-0_6b
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=7
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_DISABLE_REQUIRE=1   # 宿主机驱动 590.44 超出镜像声明的兼容白名单(<=570)，跳过约束检查
      # 宿主机驱动 590.44，但容器 compat 层为 575.57，ldconfig 优先加载了 compat/libcuda.so.575
      # 导致内核驱动(590) 与用户态库(575) 版本不匹配 → Error 803
      # 修复：将真实宿主机驱动路径置于 LD_LIBRARY_PATH 最前，覆盖 compat 层
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    volumes:
      - /media/llm:/media/llm
    ports:
      - "8014:8000"
    ipc: host
    command: >
      --model "/media/llm/Qwen/Qwen3Guard-Gen-0.6B"
      --served-model-name "Qwen3Guard-Gen-0.6B"
      --host 0.0.0.0
      --port 8000
      --max-model-len 32768
