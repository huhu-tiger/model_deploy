version: "3.9"

# Qwen3.6-35B-A3B AWQ 量化任务 Docker Compose
#
# 方案一（推荐首选）: RTN 无校准数据量化 —— 复现 QuantTrio 方案，单卡/低资源
#   docker compose -f docker-compose-quantize.yml run --rm quant-rtn
#
# 方案二（精度最高）: llmcompressor W4A16_ASYM —— 复现 cyankiwi 方案，需多卡+校准数据
#   docker compose -f docker-compose-quantize.yml run --rm quant-llmcompressor
#
# 输出路径:
#   quant-rtn          → /media/llm/Qwen/Qwen3.6-35B-A3B-AWQ-4bit-RTN
#   quant-llmcompressor → /media/llm/Qwen/Qwen3.6-35B-A3B-AWQ-4bit-LC

x-common: &common
  runtime: nvidia
  ipc: host
  shm_size: "64g"
  ulimits:
    memlock: -1
    stack: 67108864
  environment:
    # ── GPU 卡号配置（各 service 的 deploy.device_ids 须同步修改）──
    NVIDIA_VISIBLE_DEVICES: "2,3,4,5"
    # ─────────────────────────────────────────────────────────
    HF_HOME: "/media/llm/.cache/huggingface"
    HF_ENDPOINT: "https://huggingface.co"
    TRANSFORMERS_OFFLINE: "0"
  volumes:
    - /media/llm:/media/llm
    - /etc/localtime:/etc/localtime
    - ./:/workspace/quantize
  working_dir: /workspace/quantize

services:

  # ─────────────────────────────────────────────────────────────
  # 方案一: RTN 无校准数据量化（推荐首选）
  #   复现 QuantTrio/Qwen3.6-35B-A3B-AWQ，单卡即可，约 30 分钟
  # ─────────────────────────────────────────────────────────────
  quant-rtn:
    <<: *common
    image: model.vnet.com/sjhl/vllm-openai:v0.23.0
    container_name: Qwen3.6-35B-A3B-quant-rtn
    entrypoint:
      - bash
      - -c
      - |
        set -e
        OUTPUT=/media/llm/Qwen/Qwen3.6-35B-A3B-AWQ-4bit-RTN
        echo "=== 清空输出目录: $$OUTPUT ==="
        rm -rf "$$OUTPUT" && mkdir -p "$$OUTPUT"
        echo '=== 安装依赖（清华镜像源）==='
        pip install safetensors tqdm -i https://pypi.tuna.tsinghua.edu.cn/simple/ -q
        echo '=== 开始 RTN 量化（4卡并行: 0,1,2,3）==='
        python3 quantize_rtn.py \
          --model-path /media/llm/Qwen/Qwen3.6-35B-A3B \
          --output-path "$$OUTPUT" \
          --gpus 0,1,2,3
    # device_ids 指定物理卡号；容器内逻辑编号始终从 0 开始（0,1,2,3）
    # --gpus 参数传容器内逻辑编号，不要用物理编号
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2', '3', '4', '5']
              capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────
  # 方案二: llmcompressor W4A16_ASYM（精度最高）
  #   复现 cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit，需 4×80GB + 校准数据
  # ─────────────────────────────────────────────────────────────
  quant-llmcompressor:
    <<: *common
    image: model.vnet.com/sjhl/vllm-openai:v0.23.0
    container_name: Qwen3.6-35B-A3B-quant-llmcompressor
    entrypoint:
      - bash
      - -c
      - |
        set -e
        OUTPUT=/media/llm/Qwen/Qwen3.6-35B-A3B-AWQ-4bit-LC
        echo "=== 清空输出目录: $$OUTPUT ==="
        rm -rf "$$OUTPUT" && mkdir -p "$$OUTPUT"
        echo '=== 安装依赖（国内源，不走代理）==='
        pip install -r requirements.txt \
          -i https://mirrors.aliyun.com/pypi/simple/ \
          --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple/ \
          --timeout 120 --retries 5 -q \
        || pip install -r requirements.txt \
          -i https://pypi.mirrors.ustc.edu.cn/simple/ \
          --timeout 180 --retries 5 -q
        echo '=== 设置 HuggingFace 代理（pip 安装完成后）==='
        export HTTP_PROXY=http://172.31.0.55:20171
        export HTTPS_PROXY=http://172.31.0.55:20171
        export http_proxy=http://172.31.0.55:20171
        export https_proxy=http://172.31.0.55:20171
        export NO_PROXY=localhost,127.0.0.1,172.31.0.0/16,model.vnet.com
        export no_proxy=localhost,127.0.0.1,172.31.0.0/16,model.vnet.com
        echo '=== 开始 llmcompressor 量化（4卡并行: 0,1,2,3）==='
        python3 quantize_llmcompressor.py \
          --model-path /media/llm/Qwen/Qwen3.6-35B-A3B \
          --output-path "$$OUTPUT" \
          --gpus 0,1,2,3 \
          --calib-dataset cyankiwi/calibration \
          --calib-samples 384 \
          --max-seq-length 2048 \
          --scheme W4A16_ASYM
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2', '3', '4', '5']
              capabilities: [gpu]
