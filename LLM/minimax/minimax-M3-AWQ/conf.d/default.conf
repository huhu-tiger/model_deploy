# 大模型服务代理：后端为本机 MiniMax-M3-AWQ-INT4-vLLM (host.docker.internal:30003)，路径前缀 /llm/ 和 /v1/
server {
    listen 80 default_server;
    server_name _;

    # 大模型 API 入口：/llm/ 前缀转发到后端根路径
    location /llm/ {
        set $llm_body_log "";
        access_log off;
        rewrite_by_lua_block { llm_read_body() }

        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://host.docker.internal:30003/;
        proxy_buffering off;                         # 流式响应不缓冲，继承全局 off
        proxy_set_header X-Accel-Buffering no;       # 通知上层代理/CDN不缓冲
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        log_by_lua_block { llm_write_log() }
    }

    # 兼容 OpenAI 风格路径：/v1/chat/completions 等直接转发到后端
    location /v1/ {
        set $llm_body_log "";
        access_log off;
        rewrite_by_lua_block { llm_read_body() }

        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://host.docker.internal:30003/v1/;
        proxy_buffering off;                         # 流式响应不缓冲，继承全局 off
        proxy_set_header X-Accel-Buffering no;       # 通知上层代理/CDN不缓冲
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        log_by_lua_block { llm_write_log() }
    }

    # 健康检查接口直接透传，不记录请求体日志
    location /health {
        proxy_pass http://host.docker.internal:30003/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # 其余路径返回 404
    location / {
        default_type application/json;
        return 404 '{"error":"Not found. Use /llm/ or /v1/ for LLM API"}';
    }
}
