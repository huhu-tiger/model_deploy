# 大模型服务代理：后端为本机 MiniMax-M3-AWQ-INT4-vLLM (127.0.0.1:30003)，路径前缀 /llm/ 和 /v1/
# nginx 用 network_mode: host，直接监听宿主机 30001（无 docker 端口映射）
server {
    listen 30001 default_server;
    server_name _;

    # 大模型 API 入口：/llm/ 前缀转发到后端根路径（不记录请求体日志）
    location /llm/ {
        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://127.0.0.1:30003/;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 仅 /v1/chat/completions 记录请求体日志（>10KB 落盘 bodies/，≤10KB 内联 llm_proxy.log）
    location = /v1/chat/completions {
        access_log off;
        rewrite_by_lua_block { llm_read_body() }

        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://127.0.0.1:30003/v1/chat/completions;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        log_by_lua_block { llm_write_log() }
    }

    # 其它 /v1/ 接口直接转发，不记录请求体日志
    location /v1/ {
        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://127.0.0.1:30003/v1/;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 健康检查接口直接透传，不记录请求体日志
    location /health {
        proxy_pass http://127.0.0.1:30003/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # 其余路径返回 404
    location / {
        default_type application/json;
        return 404 '{"error":"Not found. Use /llm/ or /v1/ for LLM API"}';
    }
}
