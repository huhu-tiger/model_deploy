# 运行用户：用 root 便于直接写挂载的日志目录，无需 entrypoint 做 chmod（若需更高安全可改为 nobody 并保证 ./logs 可写）
user root;
# 进程 ID 文件路径
pid /var/run/nginx.pid;
# 纯代理场景固定 4 个 worker 即可；auto 在高核数（48+）服务器上会触发 sendmsg ETOOMANYREFS
worker_processes 4;
# 单进程最大可打开文件数，影响并发连接上限
worker_rlimit_nofile 65535;

events {
    # 一次接受多个新连接，提高并发
    multi_accept on;
    # 单进程最大连接数
    worker_connections 65535;
}

http {
    # 响应头中隐藏 nginx 版本号，提升安全
    server_tokens off;
    # 长连接超时：客户端 75s，与上游 65s
    keepalive_timeout 75s 65s;
    # 默认字符集
    charset utf-8;
    # 使用内核 sendfile，减少拷贝、提高静态/代理性能
    sendfile on;
    # 配合 sendfile，凑满包再发，减少小包
    tcp_nopush on;
    # 关闭 Nagle，降低延迟，适合交互/流式
    tcp_nodelay on;
    # 允许的请求体大小上限，大模型请求/上下文可能较大
    client_max_body_size 100M;
    # 增大请求体缓冲区大小，避免写入临时文件产生警告
    client_body_buffer_size 10M;
    # 增大请求头缓冲区，防止 Bearer Token 或长 header 触发 400
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;

    # OpenResty 镜像内 mime.types 在安装目录下，用绝对路径；官方 nginx 镜像可改为 include mime.types;
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Bearer Token 校验：请求头 Authorization 为以下两个密钥之一则通过
    # map $http_authorization $llm_bearer_valid {
    #     default                                                        0;
    #     "~^Bearer\s+sk-qmsVpusVeEVP6Sz6SuO8BKxfoWe8UDyXtnK2YnigbgMdb4Ji$"  1;
    #     "~^Bearer\s+sk-admin$"                                         1;
    # }

    # WebSocket 升级头：大模型流式、长连接需用
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # 声明 $llm_body_log 变量（实际内容由 Lua 写入 llm_proxy.log，此处仅为 log_format 占位，默认空串）
    map $uri $llm_body_log {
        default "";
    }

    # 全局使用 HTTP/1.1 以支持 keep-alive 和流式响应
    proxy_http_version 1.1;

    # Lua 公共函数：避免各 location 重复相同逻辑
    init_by_lua_block {
        LLM_BODY_DIR = "/var/log/nginx/bodies"
        LLM_BODY_THRESHOLD = 10 * 1024  -- 超过 10KB 才落盘到 bodies/

        -- 字节数格式化为 K（保留 1 位小数）
        function llm_format_k(bytes)
            local n = tonumber(bytes) or 0
            if n == 0 then return "0K" end
            return string.format("%.1fK", n / 1024)
        end

        -- 读取完整请求体（兼容内存/临时文件），供 log_by_lua 落盘或内联日志
        function llm_read_body()
            ngx.req.read_body()
            local b = ngx.req.get_body_data()
            if not b then
                local fname = ngx.req.get_body_file()
                if fname then
                    local f = io.open(fname, "rb")
                    if f then b = f:read("*a"); f:close() end
                end
            end
            if b and #b > 0 then
                ngx.ctx.llm_body_full = b
            else
                ngx.ctx.llm_body_full = nil
            end
        end

        -- >10KB 写入 bodies/；≤10KB 内联写入 llm_proxy.log
        function llm_write_log()
            local body_file = "-"
            local body_bytes = 0
            local request_body = "-"
            local body = ngx.ctx.llm_body_full

            if body and #body > 0 then
                body_bytes = #body
                if body_bytes > LLM_BODY_THRESHOLD then
                    local rid = string.format("%s-%s-%s",
                        os.date("%Y%m%d-%H%M%S"),
                        ngx.var.connection or "0",
                        ngx.var.connection_requests or "0")
                    body_file = LLM_BODY_DIR .. "/" .. rid .. ".json"
                    local bf = io.open(body_file, "wb")
                    if bf then
                        bf:write(body)
                        bf:close()
                    else
                        body_file = "-"
                        ngx.log(ngx.ERR, "写入请求体文件失败: ", body_file)
                    end
                else
                    request_body = body:gsub("[\r\n]+", " ")
                        :gsub('\\', '\\\\'):gsub('"', '\\"')
                end
            end

            local line = string.format(
                '%s - [%s] "%s" status=%s upstream_status=%s body_sent=%s upstream_time=%ss request_time=%ss auth_ok=%s body_bytes=%s body_file=%s request_body="%s"\n',
                ngx.var.remote_addr or "-",
                ngx.var.time_local or "-",
                ngx.var.request or "-",
                ngx.var.status or "-",
                ngx.var.upstream_status or "-",
                llm_format_k(ngx.var.body_bytes_sent),
                ngx.var.upstream_response_time or "-",
                ngx.var.request_time or "0",
                ngx.var.llm_bearer_valid or "-",
                llm_format_k(body_bytes),
                body_file,
                request_body)
            local f = io.open("/var/log/nginx/llm_proxy.log", "a")
            if f then f:write(line); f:close() end
            io.stdout:write(line); io.stdout:flush()
        end
    }

    # 错误日志级别（warn 起记）
    error_log /var/log/nginx/error.log warn;
    error_log /dev/stderr warn;

    # 大模型代理专用日志格式（仅 /v1/chat/completions 由 log_by_lua 写入 llm_proxy.log）
    log_format llm_proxy
        '$remote_addr - [$time_local] "$request" status=$status upstream_status=$upstream_status '
        'body_sent=$body_bytes_sent upstream_time=${upstream_response_time}s request_time=${request_time}s auth_ok=- '
        'body_file=- request_body=-';
    access_log /var/log/nginx/access.log llm_proxy;
    access_log /dev/stdout llm_proxy;

    # 日志滚动定时器：仅在 worker 0 中运行，避免多 worker 竞态；每 60 秒检查一次
    # 超过 10MB 则重命名并通知 nginx reopen，保留最近 5 个备份，自动清理更旧的文件
    # bodies/ 目录最多保留 100 个大请求体文件（>10KB，按修改时间滚动删除最旧）
    init_worker_by_lua_block {
        -- 只让第 0 号 worker 执行滚动，其余 worker 直接退出
        if ngx.worker.id() ~= 0 then return end

        os.execute("mkdir -p /var/log/nginx/bodies")

        ngx.log(ngx.WARN, string.format(
            "MiniMax-M3-AWQ nginx proxy started | workers=%d backend=127.0.0.1:30003 listen=:30001 body_dir=/var/log/nginx/bodies body_threshold=10KB max_body_files=100",
            ngx.worker.count()))

        local MAX_SIZE       = 10 * 1024 * 1024  -- 10 MB
        local MAX_BACKUPS    = 5                  -- 每个日志最多保留 5 个备份
        local MAX_BODY_FILES = 100                -- bodies/ 最多保留大请求体文件数
        local BODIES_DIR     = "/var/log/nginx/bodies"
        local LOG_FILES      = {
            "/var/log/nginx/access.log",
            "/var/log/nginx/llm_proxy.log",
            "/var/log/nginx/error.log",
        }

        local function file_size(path)
            local f = io.open(path, "r")
            if not f then return 0 end
            local sz = f:seek("end"); f:close()
            return sz or 0
        end

        local function rotate_log_if_needed()
            for _, log_file in ipairs(LOG_FILES) do
                if file_size(log_file) >= MAX_SIZE then
                    local ts      = os.date("%Y%m%d-%H%M%S")
                    local backup  = log_file .. "-" .. ts
                    os.rename(log_file, backup)
                    local h = io.popen("openresty -s reopen 2>&1")
                    if h then h:close() end
                    ngx.log(ngx.NOTICE, "日志已滚动: ", backup)

                    -- 清理超出数量的旧备份（ls 按名字排序，最旧的最先出现；head -n -N 输出除最新 N 个外的所有行）
                    local cmd = string.format("ls -1 %s-* 2>/dev/null | head -n -%d", log_file, MAX_BACKUPS)
                    local ls  = io.popen(cmd)
                    if ls then
                        for old in ls:lines() do
                            os.remove(old)
                            ngx.log(ngx.NOTICE, "已删除旧备份: ", old)
                        end
                        ls:close()
                    end
                end
            end
        end

        local function cleanup_old_bodies()
            local cmd = string.format(
                "ls -1t %s/*.json 2>/dev/null | tail -n +%d",
                BODIES_DIR, MAX_BODY_FILES + 1)
            local ls = io.popen(cmd)
            if not ls then return end
            for old in ls:lines() do
                os.remove(old)
                ngx.log(ngx.NOTICE, "已删除旧请求体: ", old)
            end
            ls:close()
        end

        local function check_timer(premature)
            if premature then return end
            rotate_log_if_needed()
            cleanup_old_bodies()
            local ok, err = ngx.timer.at(60, check_timer)
            if not ok then
                ngx.log(ngx.ERR, "创建日志滚动定时器失败: ", err)
            end
        end

        local ok, err = ngx.timer.at(60, check_timer)
        if not ok then
            ngx.log(ngx.ERR, "启动日志滚动定时器失败: ", err)
        end
    }

    # 代理默认请求头：真实 IP、协议、WebSocket 等
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 与上游建连超时
    proxy_connect_timeout 90s;
    # 向上游发送请求超时
    proxy_send_timeout 90s;
    # 从上游读取响应超时
    proxy_read_timeout 120s;
    # 关闭响应缓冲，便于流式输出
    proxy_buffering off;
    # 关闭请求体缓冲，大包/流式上传更快
    proxy_request_buffering off;

    include /etc/nginx/conf.d/*.conf;
}
