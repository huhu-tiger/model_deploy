# 运行用户：用 root 便于直接写挂载的日志目录，无需 entrypoint 做 chmod（若需更高安全可改为 nobody 并保证 ./logs 可写）
user root;
# 进程 ID 文件路径
pid /var/run/nginx.pid;
# 工作进程数（auto = 按 CPU 核数）
worker_processes auto;
# 单进程最大可打开文件数，影响并发连接上限
worker_rlimit_nofile 65535;

events {
    # 一次接受多个新连接，提高并发
    multi_accept on;
    # 单进程最大连接数
    worker_connections 65535;
}

http {
    # 响应头中隐藏 nginx 版本号，提升安全
    server_tokens off;
    # 长连接超时：客户端 75s，与上游 65s
    keepalive_timeout 75s 65s;
    # 默认字符集
    charset utf-8;
    # 使用内核 sendfile，减少拷贝、提高静态/代理性能
    sendfile on;
    # 配合 sendfile，凑满包再发，减少小包
    tcp_nopush on;
    # 关闭 Nagle，降低延迟，适合交互/流式
    tcp_nodelay on;
    # 允许的请求体大小上限，大模型请求/上下文可能较大
    client_max_body_size 100M;
    # 增大请求体缓冲区大小，避免写入临时文件产生警告
    client_body_buffer_size 10M;

    # OpenResty 镜像内 mime.types 在安装目录下，用绝对路径；官方 nginx 镜像可改为 include mime.types;
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Bearer Token 校验：请求头 Authorization 为以下两个密钥之一则通过
    # map $http_authorization $llm_bearer_valid {
    #     default                                                        0;
    #     "~^Bearer\s+sk-qmsVpusVeEVP6Sz6SuO8BKxfoWe8UDyXtnK2YnigbgMdb4Ji$"  1;
    #     "~^Bearer\s+sk-admin$"                                         1;
    # }

    # WebSocket 升级头：大模型流式、长连接需用
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # 请求体由 Lua 在 rewrite 阶段读入并写入 $llm_body_log（见 conf.d 中 rewrite_by_lua_block），此处不依赖 map
    # 若未用 OpenResty/Lua，则 log_format 中的 $llm_body_log 会为空，需在 location 里 set $llm_body_log "-"
    
    # 错误日志级别（warn 起记）
    error_log /var/log/nginx/error.log warn;
    error_log /dev/stderr warn;

    # 大模型代理专用日志格式（/llm/、/v1/ 已改用 log_by_lua 直接写 llm_proxy.log，请求体为原始 UTF-8，中文直接可见）
    # log_format llm_proxy
    #     '$remote_addr - [$time_local] "$request" status=$status upstream_status=$upstream_status '
    #     'body_sent=$body_bytes_sent upstream_time=${upstream_response_time}s request_time=${request_time}s auth_ok=$llm_bearer_valid '
    #     'request_body="$llm_body_log"';

    # log_format llm_proxy
    #     '$remote_addr - [$time_local] "$request" status=$status upstream_status=$upstream_status '
    #     'body_sent=$body_bytes_sent upstream_time=${upstream_response_time}s request_time=${request_time}s auth_ok=$llm_bearer_valid '
    #     'request_body="$llm_body_log"';
    log_format llm_proxy
        '$remote_addr - [$time_local] "$request" status=$status upstream_status=$upstream_status '
        'body_sent=$body_bytes_sent upstream_time=${upstream_response_time}s request_time=${request_time}s auth_ok=- '
        'request_body="$llm_body_log"';
    access_log /var/log/nginx/access.log llm_proxy;
    access_log /dev/stdout llm_proxy;

    # 日志滚动定时器（每 60 秒检查一次日志文件大小，超过 10M 则滚动）
    init_worker_by_lua_block {
        local function rotate_log_if_needed()
            local max_size = 10 * 1024 * 1024  -- 10MB
            local log_files = {
                "/var/log/nginx/access.log",
                "/var/log/nginx/llm_proxy.log"
            }
            
            for _, log_file in ipairs(log_files) do
                -- 检查文件大小
                local file = io.open(log_file, "r")
                if file then
                    local size = file:seek("end")
                    file:close()
                    
                    if size >= max_size then
                        -- 生成带时间戳的备份文件名
                        local timestamp = os.date("%Y%m%d-%H%M%S")
                        local backup_file = string.format("%s-%s", log_file, timestamp)
                        
                        -- 重命名当前日志文件
                        os.rename(log_file, backup_file)
                        
                        -- 通知 nginx 重新打开日志文件
                        local handle = io.popen("openresty -s reopen 2>&1")
                        if handle then
                            handle:close()
                        end
                        
                        ngx.log(ngx.NOTICE, "日志已滚动: ", backup_file, " (大小: ", size, " 字节)")
                    end
                end
            end
        end
        
        -- 创建定时器，每 60 秒执行一次
        local function check_timer(premature)
            if not premature then
                rotate_log_if_needed()
                -- 重新设置定时器
                local ok, err = ngx.timer.at(60, check_timer)
                if not ok then
                    ngx.log(ngx.ERR, "创建日志滚动定时器失败: ", err)
                end
            end
        end
        
        -- 启动定时器
        local ok, err = ngx.timer.at(60, check_timer)
        if not ok then
            ngx.log(ngx.ERR, "启动日志滚动定时器失败: ", err)
        end
    }

    # 代理默认请求头：真实 IP、协议、WebSocket 等
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 与上游建连超时
    proxy_connect_timeout 90s;
    # 向上游发送请求超时
    proxy_send_timeout 90s;
    # 从上游读取响应超时
    proxy_read_timeout 120s;
    # 关闭响应缓冲，便于流式输出
    proxy_buffering off;
    # 关闭请求体缓冲，大包/流式上传更快
    proxy_request_buffering off;

    # Docker 内网 DNS，用于解析 upstream 等
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/conf.d/*.conf;
}
