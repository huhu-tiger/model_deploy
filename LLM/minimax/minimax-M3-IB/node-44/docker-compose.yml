
services:
  nginx-llm-proxy:
    # 使用 OpenResty 以便用 Lua 在 rewrite 阶段读请求体并写入日志变量（标准 nginx 的 $request_body 在 proxy 场景不生效）
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-llm-proxy
    restart: unless-stopped
    ports:
      - "30002:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让 nginx 容器能访问宿主机上的 sg-minimax-m3
    user: "0:0"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]

  sg-llm:
    # 双节点 16 卡 bf16 分布式推理（TP=16，不启用 EP；实测 EP=16 性能不如纯 TP）
    # workload：输入通常 2000+ tokens（长 prefill），输出含 reasoning 长文本
    # H20 96GB: bf16 权重 ~50GB/卡，mem-fraction 0.78 留足 KV 与 prefill 余量
    # node-44: master（rank 0），暴露 HTTP API
    # node-43: worker（rank 1），纯计算节点
    # 启动顺序：先启动 node-44，再启动 node-43
    image: model.vnet.com/sjhl/sglang:dev-minimax-m3
    container_name: sg-minimax-m3
    hostname: ${MASTER_HOSTNAME}
    restart: unless-stopped
    command: >
      python3 -m sglang.launch_server
      --model-path /nvme01/MiniMax/MiniMax-M3
      --dtype bfloat16
      --tp-size 16
      --nnodes 2
      --node-rank 0
      --dist-init-addr ${MASTER_IP}:${MASTER_DIST_PORT}
      --dist-timeout 3600
      --trust-remote-code
      --host 0.0.0.0
      --port 30003
      --attention-backend triton
      --moe-runner-backend triton
      --page-size 128
      --mem-fraction-static 0.78
      --chunked-prefill-size 8192
      --max-prefill-tokens 16384
      --enable-mixed-chunk
      --schedule-policy lpm
      --max-running-requests 48
      --max-queued-requests 128
      --cuda-graph-max-bs 48
      --reasoning-parser auto
      --tool-call-parser auto
    environment:
      # 本机 8 张 H20 GPU（rank 0 侧 GPU 0-7）
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      # DeepGEMM / JIT 编译缓存目录
      SGLANG_DG_CACHE_DIR: "/root/.cache/minmax_m3_cache"
      # ── NCCL / IB RDMA（数据面：跨节点 AllReduce 等，走 4×400G IB）──
      NCCL_IB_DISABLE: "0"                              # 0=启用 IB RDMA；1=禁用，回退 TCP
      NCCL_IB_HCA: "mlx5_0,mlx5_3,mlx5_4,mlx5_7"        # 4 张活跃 ConnectX-7 IB 网卡
      NCCL_IB_GID_INDEX: "0"                            # 原生 IB 用 0；RoCE(bond0) 才用 3
      NCCL_IB_QPS_PER_CONNECTION: "4"                   # 每连接 QP 数，与 IB 卡数对齐
      NCCL_CROSS_NIC: "1"                               # 多 IB 网卡间负载均衡
      NCCL_MIN_NCHANNELS: "4"                           # 最少通信通道数，匹配 4 张 IB
      NCCL_IBEXT_DISABLE: "0"                           # 0=开启 NCCL IB 扩展优化
      # ── 控制面 socket（握手/barrier，走 bond0 172.31.0.x）──
      NCCL_SOCKET_IFNAME: "bond0"                       # NCCL 控制信令网口
      GLOO_SOCKET_IFNAME: "bond0"                       # PyTorch Gloo 控制面网口
      NCCL_DEBUG: "WARN"                                # 排查通信问题时改为 INFO
      NO_PROXY: "0.0.0.0,localhost,127.0.0.1"
      no_proxy: "0.0.0.0,localhost,127.0.0.1"
    volumes:
      - /etc/localtime:/etc/localtime
      - /etc/hosts:/etc/hosts:ro
      - /media/llm:/nvme01
      - /media/llm/minmax_m3_cache:/root/.cache/minmax_m3_cache
      - /dev/infiniband:/dev/infiniband   # 挂载 IB 设备（uverbs0/3/4/7 等）
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    privileged: true   # IB uverbs/umad 设备访问需要特权模式
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/model_info"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 900s  # 双节点握手 + 模型加载，允许较长冷启动时间
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
