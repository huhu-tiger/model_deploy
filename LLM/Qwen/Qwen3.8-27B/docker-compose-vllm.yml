version: "3.9"

# Qwen3.8-27B | vLLM | 4×A800-80G 稳定生产档
# 权重: /media/llm/Qwen/Qwen3.8-27B  (BF16，约 52GB，架构 qwen3_5 + 原生视觉)
# 配方: https://recipes.vllm.ai/Qwen/Qwen3.8-27B
# GPU / 端口 / 对外模型名与 Ornith-1.0-35B 一致: 卡 2,3,5,6，端口 30001，served-model-name=Qwen3.8-27B
#
# 镜像: vllm/vllm-openai:v0.27.1（本机已有）
#
# A800 注意:
#   * 用 BF16 本地权重；不要用官方 NVFP4（Blackwell）或 FP8 checkpoint（Ampere 无 FP8 Tensor Core）
#   * 先不要开 MTP（稳定性）；吞吐不够再加 speculative-config
#   * 256K：4×A800-80G 实测 KV≈5.53M tokens，满 262144 约 21x 并发，显存够
# OOM 时依次降: max-num-seqs → gpu-memory-utilization → max-model-len

services:
  qwen3-8-27b-vllm:
    image: vllm/vllm-openai:v0.27.1
    container_name: Qwen3.8-27B
    restart: always
    runtime: nvidia
    command: >
      /media/llm/Qwen/Qwen3.8-27B
      --served-model-name WanWu/Qwen-Auto
      --middleware model_alias_middleware.AnyModelAliasMiddleware
      --host 0.0.0.0
      --port 30001
      --tensor-parallel-size 4
      --dtype bfloat16
      --trust-remote-code
      --gpu-memory-utilization 0.90
      --max-model-len 262144
      --max-num-seqs 32
      --max-num-batched-tokens 16384
      --enable-chunked-prefill
      --enable-prefix-caching
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --mm-encoder-tp-mode data
      --mm-processor-cache-gb 0
      --limit-mm-per-prompt.image 2
      --limit-mm-per-prompt.video 0
    environment:
      NVIDIA_VISIBLE_DEVICES: "2,3,5,6"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      NVIDIA_DISABLE_REQUIRE: "1"
      VLLM_USE_MODELSCOPE: "false"
      VLLM_DEFAULT_MODEL: "WanWu/Qwen-Auto"
      PYTHONPATH: "/opt/vllm-overrides"
      VLLM_IMAGE_FETCH_TIMEOUT: "60"
      VLLM_VIDEO_FETCH_TIMEOUT: "120"
      OMP_NUM_THREADS: "1"
      NCCL_DEBUG: "warn"
      TZ: "Asia/Shanghai"
      # 宿主机驱动 590+ 且出现 Error 803（compat libcuda 与内核驱动不匹配）时再打开:
      # LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
    volumes:
      - /media/llm:/media/llm
      - ./middleware:/opt/vllm-overrides:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "30001:30001"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30001/health"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2', '3', '5', '6']
              capabilities: [gpu]
