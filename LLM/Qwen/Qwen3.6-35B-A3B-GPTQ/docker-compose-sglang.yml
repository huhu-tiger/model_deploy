version: "3.9"

# palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4 — SGLang 需 --quantization moe_wna16，不要用 --ep 2
# https://huggingface.co/palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4

services:
  qwen3-6-35b-a3b-gptq-int4:
    image: model.vnet.com/sjhl/sglang:v0.5.12
    container_name: Qwen3.6-35B-A3B-GPTQ-Int4
    restart: always
    runtime: nvidia
    command: >
      sglang serve
      --model-path /media/llm/palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4
      --served-model-name Qwen3.6-35B-A3B
      --quantization moe_wna16
      --port 30001
      --enable-metrics
      --host 0.0.0.0
      --tp 4
      --dtype float16
      --context-length 65536
      --mem-fraction-static 0.8
      --mamba-scheduler-strategy extra_buffer
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --speculative-algorithm EAGLE
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
      --mem-fraction-static 0.85
      --chunked-prefill-size 8192
      --cuda-graph-max-bs 128
      --max-running-requests 64
      --max-queued-requests 128
      --schedule-policy lpm
    environment:
      NVIDIA_VISIBLE_DEVICES: "2,3,5,6"
      SGLANG_ENABLE_SPEC_V2: "1"
      SGLANG_MAMBA_CONV_DTYPE: "float16"
      SGLANG_DG_CACHE_DIR: "/root/.cache/qwen3-6-35b-a3b-gptq-int4_cache"
    volumes:
      - /media/llm:/media/llm
      - /media/llm/qwen3-6-35b-a3b-gptq-int4_cache:/root/.cache/qwen3-6-35b-a3b-gptq-int4_cache
      - /etc/localtime:/etc/localtime
    ports:
      - "30001:30001"
    ulimits:
      memlock: -1
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30001/health"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2', '3', '5', '6']
              capabilities: [gpu]
