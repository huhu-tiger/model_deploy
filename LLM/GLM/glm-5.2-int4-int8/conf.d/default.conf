# 大模型服务代理：后端为本机 glm-5.2-int4-int8mix-vllm (host.docker.internal:30001)，Bearer Token 认证，路径前缀 /llm/
server {
    listen 80 default_server;
    server_name _;

    # 大模型 API 入口：/llm/ 前缀转发到后端根路径
    location /llm/ {
        access_log off;
        # rewrite 阶段读取请求体并存入 ngx.ctx（proxy_request_buffering on 与 read_body 配合必须显式覆盖全局 off）
        rewrite_by_lua_block { llm_read_body() }

        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://host.docker.internal:30003/;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        log_by_lua_block { llm_write_log() }
    }

    # 兼容 OpenAI 风格路径：/v1/chat/completions 等直接转发到后端
    location /v1/ {
        access_log off;
        rewrite_by_lua_block { llm_read_body() }

        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass http://host.docker.internal:30003/v1/;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        log_by_lua_block { llm_write_log() }
    }

    # 健康检查接口直接透传，不记录请求体日志
    location /health {
        proxy_pass http://host.docker.internal:30003/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # 其余路径返回 404
    location / {
        default_type application/json;
        return 404 '{"error":"Not found. Use /llm/ or /v1/ for LLM API"}';
    }
}
