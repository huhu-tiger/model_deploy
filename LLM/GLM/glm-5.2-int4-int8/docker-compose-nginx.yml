services:
  nginx-llm-proxy:
    # 使用 OpenResty 以便用 Lua 在 rewrite 阶段读请求体并写入日志变量（标准 nginx 的 $request_body 在 proxy 场景不生效）
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-glm52-proxy
    restart: unless-stopped
    ports:
      - "30001:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让 nginx 容器能访问宿主机上的 glm-5.2-int4-int8mix-vllm
    user: "0:0"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]

  glm-5.2-int4-int8mix-vllm:
    image: ${IMAGE:-model.vnet.com/sjhl/vllm-openai:glm52}
    container_name: GLM-5.2-Int4-Int8Mix-vLLM
    restart: always
    command: >
      /media/llm/QuantTrio/GLM-5.2-Int4-Int8Mix/
      --host 0.0.0.0
      --port 30003
      --served-model-name WanWu/GLM-5.2
      --trust-remote-code
      --dtype bfloat16
      --quantization compressed-tensors
      --kv-cache-dtype fp8
      --tensor-parallel-size 8
      --enable-expert-parallel
      --max-model-len 131072
      --gpu-memory-utilization 0.90
      --max-num-seqs 64
      --enable-auto-tool-choice
      --tool-call-parser glm47
      --reasoning-parser glm45
      --speculative-config.method mtp
      --speculative-config.num_speculative_tokens 1
      --enable-chunked-prefill
      --enable-prefix-caching
      --disable-uvicorn-access-log
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      VLLM_USE_MODELSCOPE: "false"
      NCCL_DEBUG: "warn"
    volumes:
      - /media/llm:/media/llm
      - /etc/localtime:/etc/localtime
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/health"]  # 直连本机 vLLM 后端（30003），因使用 network_mode: host
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
