services:
  nginx-llm-proxy:
    # 使用 OpenResty 以便用 Lua 在 rewrite 阶段读请求体并写入日志变量（标准 nginx 的 $request_body 在 proxy 场景不生效）
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-glm-5.2-awq-proxy
    restart: unless-stopped
    ports:
      - "30001:80"
    user: "0:0"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]

  glm-5.2-awq-int4-vllm:
    # GLM-5.2 最低要求 vLLM 0.23.0；固定正式版以保证部署可复现。
    # CUDA Graph：FULL 会捕获 FLASHMLA_SPARSE decode 并让 TP0 崩溃。
    # 改用 PIECEWISE（attention eager，MoE/MLP 走图），并把 batched-tokens 限制在 8192，
    # 避免 32K compile range 把 KV 压到不够 128K。
    image: ${IMAGE:-model.vnet.com/sjhl/vllm-openai:v0.27.1}
    container_name: GLM-5.2-AWQ-INT4-vLLM
    restart: unless-stopped
    runtime: nvidia
    # 模型别名中间件：任意 /v1 POST 的 model 字段改写为 VLLM_DEFAULT_MODEL
    # 依赖：--middleware + PYTHONPATH=/opt/vllm-overrides + ./middleware 挂载
    command: >
      /media/llm/cyankiwi/GLM-5.2-AWQ-INT4
      --served-model-name WanWu/GLM-Auto
      --middleware model_alias_middleware.AnyModelAliasMiddleware
      --host 0.0.0.0
      --port 30003
      --tensor-parallel-size 8
      --enable-expert-parallel
      --gpu-memory-utilization 0.92
      --max-model-len 131072
      --kv-cache-dtype fp8
      --max-num-seqs 64
      --max-num-batched-tokens 8192
      --compilation-config '{"cudagraph_mode": "PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64]}'
      --disable-custom-all-reduce
      --enable-chunked-prefill
      --enable-prefix-caching
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --chat-template-content-format string
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      VLLM_USE_MODELSCOPE: "false"
      VLLM_DEFAULT_MODEL: "WanWu/GLM-Auto"
      PYTHONPATH: "/opt/vllm-overrides"
      NCCL_DEBUG: "warn"
      # 当前节点的 NVLink SHARP 初始化会触发 CUDA error 401，回退到普通 NCCL 通信
      NCCL_NVLS_ENABLE: "0"
      # DeepGEMM JIT 预热跳过（GLM-5.2 系列使用 DeepGEMM 内核，首次请求时按需编译）
      VLLM_DEEP_GEMM_WARMUP: "skip"
      # 关闭 CUDA graph 显存线性外推，避免再吞掉 KV 预算
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    volumes:
      - /media/llm:/media/llm
      - ./middleware:/opt/vllm-overrides:ro
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    shm_size: "32g"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2', '3', '4', '5', '6', '7']
              capabilities: [gpu]
