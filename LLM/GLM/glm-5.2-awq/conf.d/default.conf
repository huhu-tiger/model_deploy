# 大模型服务代理：后端为 compose 内网 GLM-5.2-AWQ-INT4-vLLM:30003，路径前缀 /llm/ 和 /v1/
# 宿主机映射 30002:80，vLLM 不映射到宿主机
#
# 注意：proxy_pass 后端必须用变量（$backend）而非裸主机名。
# 裸主机名会在 nginx 启动/reload 时用系统解析器一次性解析并缓存 IP：
#   1) 若此时后端容器 DNS 未就绪，nginx 会直接报 "host not found in upstream" 无法启动；
#   2) 后端容器重启换 IP 后，nginx 不会重新解析，会一直打到旧 IP 直到手动重建 nginx。
# 用变量可让 nginx 按 http{} 里的 resolver 127.0.0.11 在每次请求时动态解析（valid=10s）。
server {
    listen 80 default_server;
    server_name _;

    set $backend "http://glm-5.2-awq-int4-vllm:30003";

    # 大模型 API 入口：/llm/ 前缀转发到后端根路径（不记录请求体日志）
    location /llm/ {
        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        # 变量 proxy_pass 带 URI 时不会做前缀替换，只会把整段 URI 换成指定值。
        # 先 rewrite 去掉 /llm/，再 proxy_pass $backend（不带 URI）透传剩余路径。
        rewrite ^/llm/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 90s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 仅 /v1/chat/completions 记录请求体日志（>10KB 落盘 bodies/，≤10KB 内联 llm_proxy.log）
    location = /v1/chat/completions {
        access_log off;
        rewrite_by_lua_block { llm_read_body() }

        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        proxy_pass $backend/v1/chat/completions;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 90s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        log_by_lua_block { llm_write_log() }
    }

    # 其它 /v1/ 接口直接转发，不记录请求体日志
    location /v1/ {
        default_type application/json;
        # if ($llm_bearer_valid = 0) {
        #     return 401 '{"error":"Missing or invalid Bearer token"}';
        # }

        # 不带 URI：原请求 /v1/models 原样转发。若写成 $backend/v1/ 会变成只请求 /v1/。
        proxy_pass $backend;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 90s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 健康检查接口直接透传，不记录请求体日志
    location /health {
        proxy_pass $backend/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # 其余路径返回 404
    location / {
        default_type application/json;
        return 404 '{"error":"Not found. Use /llm/ or /v1/ for LLM API"}';
    }
}
