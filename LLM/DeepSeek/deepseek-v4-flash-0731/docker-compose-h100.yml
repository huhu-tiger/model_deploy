# DeepSeek-V4-Flash-0731 — SGLang 0.5.17 — H100 + OpenResty 代理
# Reference: https://docs.sglang.io/cookbook/autoregressive/DeepSeek/DeepSeek-V4
#   hw=h100&variant=flash-official&quant=fp4&strategy=low-latency（长上下文，防 OOM）
# Hardware: H100 × 8 | Flash Official 0731（expert=FP4 → marlin）| context=256K + DSPARK
# 权重: /media/llm/deepseek-ai/DeepSeek-V4-Flash-0731
# 镜像: model.vnet.com/sjhl/sglang:v0.5.17
# 对外: nginx :30001 → 后端 host:30003（与 GLM nginx 端口一致）
#
# OOM 说明：长文 prefill indexer 峰值约需额外 ~2GiB；mem-fraction 过高会被 KV/图占满。
# 故压低 mem-fraction / chunk / dspark-block / concurrency，给 activation 留余量。

services:
  nginx-llm-proxy:
    # 使用 OpenResty 以便用 Lua 在 rewrite 阶段读请求体并写入日志变量（标准 nginx 的 $request_body 在 proxy 场景不生效）
    # network_mode: host：避免 UFW 拦截 docker bridge → 宿主机 30003
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-deepseek-v4-flash-proxy
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]

  deepseek-v4-flash:
    image: model.vnet.com/sjhl/sglang:v0.5.17
    container_name: deepseek-v4-flash
    restart: unless-stopped
    command: >
      sglang serve
      --trust-remote-code
      --model-path /models/DeepSeek-V4-Flash-0731
      --context-length 262144
      --mem-fraction-static 0.80
      --tp 8
      --moe-runner-backend marlin
      --speculative-algorithm DSPARK
      --speculative-dspark-block-size 3
      --swa-full-tokens-ratio 0.1
      --chunked-prefill-size 8192
      --cuda-graph-max-bs 32
      --max-running-requests 16
      --enable-metrics
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --host 0.0.0.0
      --port 30003
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SGLANG_DG_CACHE_DIR: "/root/.cache/deepseek-v4-flash-0731-cache"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_DEBUG: "warn"
    volumes:
      - /media/llm/deepseek-ai/DeepSeek-V4-Flash-0731:/models/DeepSeek-V4-Flash-0731:ro
      - /media/llm/deepseek-v4-flash-0731-cache:/root/.cache/deepseek-v4-flash-0731-cache
      - /etc/localtime:/etc/localtime
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
