# DeepSeek-V4-Flash-0731 — SGLang 0.5.17 — H100 + OpenResty 代理
# Reference: https://docs.sglang.io/cookbook/autoregressive/DeepSeek/DeepSeek-V4
#   hw=h100&variant=flash-official&quant=fp4&strategy=long-context-high-throughput
# Hardware: H100 × 8 | Flash Official 0731（expert=FP4 → marlin）| context=256K + DSPARK
# 权重: /media/llm/deepseek-ai/DeepSeek-V4-Flash-0731
# 镜像: model.vnet.com/sjhl/sglang:v0.5.17
# 对外: nginx :30001 → 后端 host:30003（与 GLM nginx 端口一致）
#
# 调参目标：长上下文 + 高吞吐（decode/KV 优先），并降低长文 sparse prefill 卡死→NCCL 超时风险。
# 启动后看日志 available_gpu_mem：建议留 5–8GB；过高可再抬 mem-fraction，过低则回退。

services:
  nginx-llm-proxy:
    # 使用 OpenResty 以便用 Lua 在 rewrite 阶段读请求体并写入日志变量（标准 nginx 的 $request_body 在 proxy 场景不生效）
    # network_mode: host：避免 UFW 拦截 docker bridge → 宿主机 30003
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-deepseek-v4-flash-proxy
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]

  deepseek-v4-flash:
    image: model.vnet.com/sjhl/sglang:v0.5.17
    container_name: deepseek-v4-flash
    restart: unless-stopped
    # 关键参数说明（command: > 内不能写 #，否则会进命令行）：
    #   --context-length              最大上下文（256K）
    #   --mem-fraction-static         权重+KV 显存占比；抬高→KV/并发↑（原 0.80，余量约 14GB）
    #   --tp                          Tensor Parallel=8
    #   --moe-runner-backend          Flash FP4 → marlin
    #   --speculative-algorithm       DSPARK：抬 decode 吞吐、降 TPOT
    #   --speculative-dspark-block-size  草稿块；4 更吞吐（显存/不稳定时改回 3）
    #   --swa-full-tokens-ratio       SWA 中 full-attn 池占比
    #   --chunked-prefill-size        长文 prefill 分块；16384 提 prefill 吞吐（OOM 改 8192）
    #   --max-prefill-tokens          单步 prefill 总 token 上限（≈2×chunk 或更大）
    #   --prefill-max-requests        同时 prefill 请求数；限制防长文卡死/NCCL timeout
    #   --cuda-graph-max-bs           decode CUDA Graph 最大 bs，需 ≥ max-running-requests
    #   --max-running-requests        并发 running 上限（吞吐主旋钮）
    #   --max-queued-requests         排队上限，满则拒请求，保护尾延迟
    #   --schedule-conservativeness   <1 更激进排程、更高吞吐
    #   --watchdog-timeout            调度卡死自杀阈值（秒）
    command: >
      sglang serve
      --trust-remote-code
      --model-path /models/DeepSeek-V4-Flash-0731
      --context-length 262144
      --mem-fraction-static 0.85
      --tp 8
      --moe-runner-backend marlin
      --speculative-algorithm DSPARK
      --speculative-dspark-block-size 4
      --swa-full-tokens-ratio 0.1
      --chunked-prefill-size 16384
      --max-prefill-tokens 32768
      --prefill-max-requests 2
      --cuda-graph-max-bs 32
      --max-running-requests 32
      --max-queued-requests 64
      --schedule-conservativeness 0.5
      --watchdog-timeout 900
      --enable-metrics
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --host 0.0.0.0
      --port 30003
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SGLANG_DG_CACHE_DIR: "/root/.cache/deepseek-v4-flash-0731-cache"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_DEBUG: "warn"
      # 便于 watchdog 触发时抓 CUDA coredump（需配合 SYS_PTRACE）
      CUDA_ENABLE_USER_TRIGGERED_COREDUMP: "1"
    volumes:
      - /media/llm/deepseek-ai/DeepSeek-V4-Flash-0731:/models/DeepSeek-V4-Flash-0731:ro
      - /media/llm/deepseek-v4-flash-0731-cache:/root/.cache/deepseek-v4-flash-0731-cache
      - /etc/localtime:/etc/localtime
      # Backport https://github.com/sgl-project/sglang/pull/34600 onto v0.5.17
      # （PR 未合入官方镜像；覆盖 streaming tool-call / reasoning parser）
      - ./sglang-patches/deepseekv32_detector.py:/sgl-workspace/sglang/python/sglang/srt/function_call/deepseekv32_detector.py:ro
      - ./sglang-patches/reasoning_parser.py:/sgl-workspace/sglang/python/sglang/srt/parser/reasoning_parser.py:ro
    # py-spy / 崩溃栈 dump 需要 ptrace；否则只有 Permission denied
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
