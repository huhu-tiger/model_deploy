# DeepSeek-V4-Flash-0731 — SGLang 0.5.18 — 单机 H20 × 8 + OpenResty
# Hardware: H20 96GB × 8（NVLink）| TP8 | FP4 MoE (Marlin) | FP8 KV | DSV4 | DSPARK
# Target: 300K 输入 + 2K 输出，兼顾长上下文稳定性和 Prefix Cache 吞吐
# 对外: nginx :30001 → SGLang :30003
# 启动后观察 available_gpu_mem；建议保留 5–8GB，OOM 时先下调 mem-fraction-static。

services:
  nginx-llm-proxy:
    # network_mode: host：避免 UFW 拦截 docker bridge → 宿主机 30003
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-deepseek-v4-flash-proxy
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]

  deepseek-v4-flash:
    image: ${DOCKER_IMAGE:-model.vnet.com/sjhl/sglang:v0.5.18}
    container_name: deepseek-v4-flash
    restart: unless-stopped
    command: >
      sglang serve
      --trust-remote-code
      --model-path /models/DeepSeek-V4-Flash-0731
      --context-length 327680
      --mem-fraction-static 0.85
      --kv-cache-dtype fp8_e4m3
      --page-size 256
      --tp 8
      --moe-runner-backend marlin
      --attention-backend dsv4
      --speculative-algorithm DSPARK
      --speculative-dspark-block-size 4
      --swa-full-tokens-ratio 0.1
      --chunked-prefill-size 16384
      --max-prefill-tokens 32768
      --prefill-max-requests 1
      --cuda-graph-max-bs-decode 16
      --max-running-requests 16
      --max-queued-requests 32
      --schedule-policy lpm
      --schedule-conservativeness 0.8
      --watchdog-timeout 900
      --disable-flashinfer-autotune
      --preferred-sampling-params '{"temperature":0.1,"top_p":1.0}'
      --enable-metrics
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --host 0.0.0.0
      --port 30003
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SGLANG_DG_CACHE_DIR: "/root/.cache/deepseek-v4-flash-0731-cache"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_JIT_DEEPGEMM_PRECOMPILE: "0"
      SGLANG_SHARED_EXPERT_TP1: "1"
      SGLANG_INVARIANT_CHECK: "1"
      SGLANG_SANITIZE_NAN_LOGITS: "1"
      SGLANG_DSV4_COMPRESS_STATE_DTYPE: "float32"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_P2P_DISABLE: "0"
      NCCL_SHM_DISABLE: "0"
      NCCL_DEBUG: "WARN"
      CUDA_ENABLE_USER_TRIGGERED_COREDUMP: "1"
    volumes:
      - ${MODEL_HOST_PATH:-/media/llm/deepseek-ai/DeepSeek-V4-Flash-0731}:/models/DeepSeek-V4-Flash-0731:ro
      - ${CACHE_HOST_PATH:-/media/llm/deepseek-v4-flash-0731-cache}:/root/.cache/deepseek-v4-flash-0731-cache
      - /etc/localtime:/etc/localtime:ro
      # v0.5.18 已内置 DeepSeek V4 parser 与相关修复，不再覆盖旧版补丁。
    # py-spy / 崩溃栈 dump 需要 ptrace；否则只有 Permission denied
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
