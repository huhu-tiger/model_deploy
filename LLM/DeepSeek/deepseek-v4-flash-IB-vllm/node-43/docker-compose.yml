# DeepSeek-V4-Flash-0731 — vLLM 0.25.0 — 双节点 16 卡 H20 + IB
# 官方 recipe: https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash
#   hardware=H200  variant=FP8(0731)  单机默认 TEP TP=8
# 双节点不能 TEP TP=16：权重 o_groups=8，TP>8 会切出空分片，
# DeepGEMM post-process 除零（ZeroDivisionError: wq.size(0) // g）
# 故 DP=2 + TP=8 + EP：每节点 = 官方 8 卡 TEP，跨节点 DP
# 镜像用 0.25.0：Hopper 上 0.26/0.27 会乱码（#51326）
# 不开 DSpark：双节点 IB 先求稳（H20 #50660 FlashMLA）
# --no-enable-prefix-caching：V1 默认开 prefix cache，长上下文会加重提前 EOS
# （对应 SGLang --disable-radix-cache）
# vllm-patches：必须盖住 /usr/lib/python3.12/sitecustomize.py
# （Debian 先加载它，dist-packages 里的 sitecustomize 不会跑）
# 另挂 .pth，site 初始化时 import long_ctx_defaults
# node-43: master（rank 0），nginx :30001 → vLLM :30003
# 启动顺序：43/44 几乎同时启动，不能等 master-port 就绪再起 worker——
# DP=2+TP=8+nnodes=2 下 master 的 EngineCore 要等 worker 侧 DP 握手
# 才会 bind master-port，反过来等就会两端互相死锁（run.sh 已处理）

services:
  nginx-llm-proxy:
    image: model.vnet.com/sjhl/openresty:1.27.1.2-0-alpine
    container_name: nginx-deepseek-v4-flash-vllm-proxy
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
      - ../conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    command: ["openresty", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    depends_on:
      - deepseek-v4-flash-vllm

  deepseek-v4-flash-vllm:
    image: ${DOCKER_IMAGE:-vllm/vllm-openai:v0.25.0}
    container_name: deepseek-v4-flash-vllm
    hostname: ${MASTER_HOSTNAME}
    restart: unless-stopped
    runtime: nvidia
    command: >
      /media/llm/deepseek-ai/DeepSeek-V4-Flash-0731
      --served-model-name WanWu/Deepseek-Auto
      --host 0.0.0.0
      --port 30003
      --trust-remote-code
      --kv-cache-dtype fp8
      --block-size 256
      --max-model-len 393216
      --enable-expert-parallel
      --tensor-parallel-size 8
      --data-parallel-size 2
      --nnodes 2
      --node-rank 0
      --master-addr ${MASTER_IP}
      --master-port ${MASTER_DIST_PORT}
      --distributed-executor-backend mp
      --distributed-timeout-seconds 3600
      --tokenizer-mode deepseek_v4
      --tool-call-parser deepseek_v4
      --enable-auto-tool-choice
      --reasoning-parser deepseek_v4
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
      --max-num-batched-tokens 8192
      --no-enable-flashinfer-autotune
      --enable-ep-weight-filter
      --no-enable-prefix-caching
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      VLLM_HOST_IP: "${MASTER_IP}"
      VLLM_USE_MODELSCOPE: "false"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "mlx5_0,mlx5_3,mlx5_4,mlx5_7"
      NCCL_IB_GID_INDEX: "0"
      NCCL_IB_QPS_PER_CONNECTION: "4"
      NCCL_CROSS_NIC: "1"
      NCCL_MIN_NCHANNELS: "4"
      NCCL_IBEXT_DISABLE: "0"
      NCCL_SOCKET_IFNAME: "bond0"
      GLOO_SOCKET_IFNAME: "bond0"
      NCCL_DEBUG: "WARN"
      NO_PROXY: "0.0.0.0,localhost,127.0.0.1,${MASTER_IP},${WORKER_IP}"
      no_proxy: "0.0.0.0,localhost,127.0.0.1,${MASTER_IP},${WORKER_IP}"
      VLLM_LONG_CTX_DEFAULTS: "1"
      VLLM_LONG_CTX_MIN_TOKENS_THRESHOLD: "32768"
      VLLM_LONG_CTX_MIN_TOKENS: "32"
      VLLM_DEFAULT_TEMPERATURE: "0"
      VLLM_DEFAULT_TOP_P: "1.0"
    volumes:
      - /media/llm:/media/llm
      - /etc/localtime:/etc/localtime:ro
      - /etc/hosts:/etc/hosts:ro
      - /dev/infiniband:/dev/infiniband
      - ../vllm-patches/sitecustomize.py:/usr/lib/python3.12/sitecustomize.py:ro
      - ../vllm-patches/sitecustomize.py:/usr/local/lib/python3.12/dist-packages/sitecustomize.py:ro
      - ../vllm-patches/long_ctx_defaults.py:/usr/local/lib/python3.12/dist-packages/long_ctx_defaults.py:ro
      - ../vllm-patches/vllm_long_ctx.pth:/usr/local/lib/python3.12/dist-packages/vllm_long_ctx.pth:ro
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30003/health"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2', '3', '4', '5', '6', '7']
              capabilities: [gpu]
