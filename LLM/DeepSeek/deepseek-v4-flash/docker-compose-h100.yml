# DeepSeek-V4-Flash (FP8) — SGLang v0.5.12 — H200 Max-Throughput Recipe
# Reference: https://lmsysorg.mintlify.app/cookbook/autoregressive/DeepSeek/DeepSeek-V4
# Hardware: H200 × 8 | Variant: Flash (285B) | Recipe: max-throughput
#   TP=8, DP=8, DeepEP backend, MTP disabled (verify cost > gain at high batch)
#   constraint: max-running-requests × draft_tokens ≤ DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK
#               256 × 1 = 256 ≤ 256 ✓

services:
  deepseek-v4-flash:
    image: model.vnet.com/sjhl/sglang:v0.5.12
    container_name: deepseek-v4-flash
    restart: unless-stopped
    command: >
      sglang serve
      --trust-remote-code
      --model-path /models/DeepSeek-V4-Flash-FP8
      --tp 8
      --dp 8
      --enable-dp-attention
      --moe-a2a-backend deepep
      --cuda-graph-max-bs 128
      --max-running-requests 256
      --deepep-config '{"normal_dispatch":{"num_sms":96},"normal_combine":{"num_sms":96}}'
      --enable-metrics
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --host 0.0.0.0
      --port 30000
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      # H200 FP8: disable FP4 expert path
      SGLANG_DSV4_FP4_EXPERTS: "0"
      # max-throughput h200|small: 256 tokens/rank，满足 256×1=256 ≤ 256
      SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "256"
      SGLANG_DG_CACHE_DIR: "/root/.cache/deepseek-v4-flash_cache"
      NCCL_DEBUG: "warn"
    volumes:
      - /media/llm/sgl-project/DeepSeek-V4-Flash-FP8:/models/DeepSeek-V4-Flash-FP8:ro
      - /media/llm/deepseek-v4-flash_cache:/root/.cache/deepseek-v4-flash_cache
      - /etc/localtime:/etc/localtime
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    shm_size: "32g"
    ports:
      - "30000:30000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
