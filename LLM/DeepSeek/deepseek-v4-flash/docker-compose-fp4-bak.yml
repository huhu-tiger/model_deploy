# DeepSeek-V4-Flash (FP4) — SGLang v0.5.12 — H100 Max-Throughput Recipe
# Reference: https://lmsysorg.mintlify.app/cookbook/autoregressive/DeepSeek/DeepSeek-V4
# Hardware: H100 × 8 | Variant: Flash (285B) | Recipe: max-throughput
#   Original FP4 checkpoint, TP=8, Marlin w4a16 MoE kernel (TP only, no DP/DeepEP)
#   MTP disabled at max-throughput (verify cost > gain at high batch)

services:
  deepseek-v4-flash:
    image: model.vnet.com/sjhl/sglang:v0.5.12
    container_name: deepseek-v4-flash-fp4
    restart: unless-stopped
    command: >
      sglang serve
      --trust-remote-code
      --model-path /models/DeepSeek-V4-Flash
      --tp 8
      --moe-runner-backend marlin
      --enable-metrics
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --host 0.0.0.0
      --port 30000
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SGLANG_DG_CACHE_DIR: "/root/.cache/deepseek-v4-fp4-flash_cache"
      NCCL_DEBUG: "warn"
    volumes:
      - /media/llm/deepseek-ai/DeepSeek-V4-Flash:/models/DeepSeek-V4-Flash:ro
      - /media/llm/deepseek-v4-fp4-flash_cache:/root/.cache/deepseek-v4-fp4-flash_cache
      - /etc/localtime:/etc/localtime
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    shm_size: "32g"
    ports:
      - "30000:30000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8
              capabilities: [gpu]
