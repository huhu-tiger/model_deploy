# DeepSeek-V4-Flash-0731 — SGLang 0.5.18 — 双节点 16 卡 H20 + IB
# node-44: PP stage 1（rank 1），纯计算节点，不对外暴露 HTTP API
# 参数须与 node-43 一致（仅 rank / hostname 不同）
# 300K 输入 + 2K 输出低延迟配置：TP=8、PP=2、动态 chunked prefill、Radix prefix cache

services:
  deepseek-v4-flash:
    image: ${DOCKER_IMAGE:-model.vnet.com/sjhl/sglang:v0.5.18}
    container_name: deepseek-v4-flash
    hostname: ${WORKER_HOSTNAME}
    restart: unless-stopped
    command: >
      sglang serve
      --trust-remote-code
      --model-path /models/DeepSeek-V4-Flash-0731
      --context-length 327680
      --mem-fraction-static 0.85
      --kv-cache-dtype fp8_e4m3
      --page-size 256
      --tp 8
      --pp-size 2
      --nnodes 2
      --node-rank 1
      --dist-init-addr ${MASTER_IP}:${MASTER_DIST_PORT}
      --dist-timeout 3600
      --moe-runner-backend marlin
      --attention-backend dsv4
      --swa-full-tokens-ratio 0.1
      --chunked-prefill-size 12288
      --enable-dynamic-chunking
      --max-prefill-tokens 32768
      --prefill-max-requests 1
      --cuda-graph-max-bs-decode 8
      --disable-custom-all-reduce
      --max-running-requests 8
      --max-queued-requests 16
      --schedule-policy lpm
      --schedule-conservativeness 0.8
      --watchdog-timeout 900
      --skip-server-warmup
      --disable-flashinfer-autotune
      --preferred-sampling-params '{"temperature":0.1,"top_p":1.0}'
      --enable-metrics
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --host 0.0.0.0
      --port 30003
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SGLANG_DG_CACHE_DIR: "/root/.cache/deepseek-v4-flash-0731-cache"
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
      SGLANG_JIT_DEEPGEMM_PRECOMPILE: "0"
      SGLANG_SHARED_EXPERT_TP1: "1"
      SGLANG_DYNAMIC_CHUNKING_SMOOTH_FACTOR: "0.75"
      # 排查超长上下文下偶发提前 EOS：WARN 级别只打日志不崩溃
      SGLANG_INVARIANT_CHECK: "1"
      SGLANG_SANITIZE_NAN_LOGITS: "1"
      SGLANG_DSV4_COMPRESS_STATE_DTYPE: "float32"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "mlx5_0,mlx5_3,mlx5_4,mlx5_7"
      NCCL_IB_GID_INDEX: "0"
      NCCL_IB_QPS_PER_CONNECTION: "4"
      NCCL_CROSS_NIC: "1"
      NCCL_MIN_NCHANNELS: "4"
      NCCL_IBEXT_DISABLE: "0"
      NCCL_SOCKET_IFNAME: "bond0"
      GLOO_SOCKET_IFNAME: "bond0"
      NCCL_DEBUG: "WARN"
      NO_PROXY: "0.0.0.0,localhost,127.0.0.1,${MASTER_IP},${WORKER_IP}"
      no_proxy: "0.0.0.0,localhost,127.0.0.1,${MASTER_IP},${WORKER_IP}"
    volumes:
      - ${MODEL_HOST_PATH:-/media/llm/deepseek-ai/DeepSeek-V4-Flash-0731}:/models/DeepSeek-V4-Flash-0731:ro
      - ${CACHE_HOST_PATH:-/media/llm/deepseek-v4-flash-0731-cache}:/root/.cache/deepseek-v4-flash-0731-cache
      - /etc/localtime:/etc/localtime:ro
      - /etc/hosts:/etc/hosts:ro
      - /dev/infiniband:/dev/infiniband
      # v0.5.18 已内置 DeepSeek V4 parser、DP gather、fused kernel 与 multi-stream 优化；
      # 禁止用旧版补丁覆盖镜像源码。
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
