version: "3.9"
services:
  kimik26:
    image: model.vnet.com/sjhl/sglang:v0.5.10.post1
    container_name: Kimi-K2.6
    restart: always
    command: >
      python3 -m sglang.launch_server
      --model-path /media/llm/moonshotai/Kimi-K2.6
      --port 30001
      --tp 8 
      --trust-remote-code 
      --reasoning-parser kimi_k2 
      --tool-call-parser kimi_k2 
      --enable-metrics
      --host 0.0.0.0
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"  # 使用所有 GPU
      SGLANG_DG_CACHE_DIR: "/root/.cache/kimik26_cache"
    volumes:
      - /media/llm:/media/llm
      - /media/llm/kimik26_cache:/root/.cache/kimik26_cache
      - /etc/localtime:/etc/localtime
    ports:
      - "30001:30001"
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    ipc: host
    shm_size: "32g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:30001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
